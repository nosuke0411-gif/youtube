<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube URL 変換ツール</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        input {
            width: 300px;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            margin-left: 10px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>YouTube URL 変換ツール</h1>

    <input id="urlInput" type="text" placeholder="URLを入力">
    <button onclick="convert()">変換する</button>

    <p id="result"></p>

    <script>
        async function convert() {
            const url = document.getElementById("urlInput").value;

            const res = await fetch("https://youtube-7p95.onrender.com/convert", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({url})
            });

            const data = await res.json();

            if (data.success) {
                document.getElementById("result").innerText = data.converted;
            } else {
                document.getElementById("result").innerText = "エラー: " + data.error;
            }
        }
    </script>

</body>
</html>
